naming_divergence:
  note: >-
    Three vocabularies name the same objects differently and an agent crossing surfaces must
    translate. MCP says "soundbite", GraphQL says "bite". MCP says "meetingId", GraphQL says
    "transcript_id". The docs schema page is titled "UserGroups" while the field type is
    UserGroup. The local graphql/fireflies-schema.graphql additionally uses AIAppOutput and
    AskFredThreadResult where the docs use AppOutput and AskFredResponse — the documentation
    pages above are the authority for this artifact.
