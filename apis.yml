aid: fireflies
name: Fireflies.ai
description: 'Fireflies.ai is an AI meeting assistant that automatically joins video
  calls, records, transcribes, and summarizes meetings across platforms such as Zoom,
  Google Meet, and Microsoft Teams. The platform provides a GraphQL API giving developers
  structured access to call recordings, transcripts, summaries, action items, speaker
  analytics, and meeting intelligence. Teams can retrieve and search transcript data,
  manage meetings programmatically, and integrate meeting context into CRM, project
  management, and workflow automation tools. Advanced features include AskFred AI
  for natural language queries against meeting content, real-time transcription via
  a live API, webhooks for event-driven integrations, and an MCP server for connecting
  AI tooling directly to meeting data.

  '
