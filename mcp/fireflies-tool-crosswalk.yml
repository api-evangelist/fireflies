method: derived
source: mcp/fireflies-mcp.yml + graphql/fireflies-schema.graphql + openapi/*.yml + https://docs.fireflies.ai/graphql-api/
description: >-
  Binds each Fireflies MCP tool to the GraphQL operation that backs it. Fireflies has no
  resource-per-path REST surface: every REST operation in openapi/ is the SAME single
  transport operation (operationId `graphqlOperation`, POST https://api.fireflies.ai/graphql),
  so the meaningful binding target is the GraphQL field, not a REST operationId. Each row
  therefore carries `graphql:` as the real capability binding and `rest:` as the transport
  it travels over. Every GraphQL field named here was verified against the provider's own
  reference pages under https://docs.fireflies.ai/graphql-api/ — none is inferred.
surfaces:
  openapi:
    files:
    - openapi/fireflies-transcripts-api-openapi.yml
    - openapi/fireflies-users-api-openapi.yml
    - openapi/fireflies-bites-api-openapi.yml
    - openapi/fireflies-live-meetings-api-openapi.yml
    - openapi/fireflies-audio-upload-api-openapi.yml
    - openapi/fireflies-ai-apps-api-openapi.yml
    operations: 1
    operation_id: graphqlOperation
    note: Single GraphQL transport POST; not a per-resource REST surface.
  graphql:
    endpoint: https://api.fireflies.ai/graphql
    introspection: gated
    introspection_evidence: 'POST {__schema{queryType{name}}} anonymously -> HTTP 500 auth_failed'
    reference: https://docs.fireflies.ai/graphql-api/query/transcripts
  mcp:
    url: https://api.fireflies.ai/mcp
    tools_list: gated
    tools_list_evidence: 'POST tools/list anonymously -> HTTP 401 invalid_token'
    reference: https://docs.fireflies.ai/mcp-tools/overview
  realtime:
    endpoint: wss://api.fireflies.ai
    path: /ws/realtime
    note: Socket.IO live transcription; no MCP tool exposes it.
